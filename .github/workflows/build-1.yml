name: Build Hisab APK

# Builds Hisab.apk from the code in this repo on every push.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Hisab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hisab-apk
          path: Hisab.apk

      - name: Publish as a release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hisab 1.0.${{ github.run_number }}
          files: Hisab.apk
          make_latest: true
