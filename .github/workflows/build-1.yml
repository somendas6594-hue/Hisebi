name: Build Hisab APK

# This one file contains the whole Hisab app (packed below).
# When this file carries a newer code version, it unpacks it into the repo, then builds Hisab.apk.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app code (when this file carries a newer version)
        run: |
          BUNDLE=2
          if [ "$(cat .hisab-version 2>/dev/null)" = "$BUNDLE" ]; then
            echo "Code in repo is already version $BUNDLE"
            exit 0
