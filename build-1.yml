name: Build Hisab APK

# This one file contains the whole Hisab app (packed below).
# First run: it unpacks the code into the repo and builds Hisab.apk.
# Later runs: it just builds whatever code is in the repo.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app code (first run only)
        run: |
          if [ -f app/build.gradle ]; then
            echo "Code already in repo, skipping unpack"
            exit 0
